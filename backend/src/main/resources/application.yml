spring:
  application:
    name: fitness-backend
  datasource:
    url: jdbc:postgresql://localhost:5432/fitness
    username: postgres
    password: 123456
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
