spring:
  application:
    name: fitness-backend
  datasource:
    url: jdbc:postgresql://localhost:5432/fitness
    username: postgres
    password: 123456
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: localhost
      port: 6379
      password: ""
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
server:
  port: 8080
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
logging:
  level:
    com.fitness: debug
jwt:
  secret: 0lBhzWa5956Khbi6htVN2JVxnr4h+pC4JCgCqwSKF2UcrS1uCAdqdglIHcKIXV2Z
  expire-seconds: 86400
oss:
  # 是否启用阿里云 OSS（填入下方配置后改为 true）
  enabled: false
  # 地域节点，如 oss-cn-hangzhou.aliyuncs.com（与 bucket 同地域）
  endpoint: ""
  access-key-id: ""
  access-key-secret: ""
  # Bucket 名称
  bucket: ""
  # 图片访问 URL 前缀，如 https://fit-images.oss-cn-hangzhou.aliyuncs.com
  url-prefix: ""
